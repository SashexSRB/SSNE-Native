# SSNE-Native build kit: tells the launcher how to build SSNE-Native-Game.exe on this PC from
# the player's own disc. "kit:" means this folder.

# Engine version: when it changes, the launcher offers to rebuild a game built with an older kit.
version = 21

# Translator (PowerPC main.dol -> C++) and the function-name map for USA Rev 1.
recomp = kit:ssne-recomp.exe
symbols = kit:G3BE9G_r1.sym
# Other releases (by disc ID): Europe / PAL (English, French, German)
symbols.G3BP9G = kit:G3BP9G_r0.sym

# Compiler: LLVM-MinGW (free, Apache 2.0 with LLVM exceptions / mingw-w64 licenses), downloaded once from its
# official GitHub release. It must be this exact release: the prebuilt libraries in lib/ were built with it.
# The MSVCRT variant runs on Windows 7 SP1 / 8.1 / 10 / 11 without the Universal C Runtime (UCRT) update.
toolchain_name = LLVM-MinGW 20241119 (MSVCRT)
toolchain_url = https://github.com/mstorsjo/llvm-mingw/releases/download/20241119/llvm-mingw-20241119-msvcrt-x86_64.zip
toolchain_sha256 = 7119de7c3c56d24be0b84f19871b128a157e0ee85d0890f609f12bcc7c02f61f
toolchain_size_mb = 146
toolchain_dir = kit:toolchain
toolchain_skip = aarch64-w64-mingw32/ armv7-w64-mingw32/ i686-w64-mingw32/ share/ python/
compiler = bin/clang++.exe
compiler_flags = --target=x86_64-w64-mingw32 -rtlib=compiler-rt -unwindlib=libunwind -stdlib=libc++ -fuse-ld=lld

# Generated code
cxxflags = -std=gnu++20 -O2 -DNDEBUG -w -Ikit:include

# Final link: {objs} = the compiled game code; the rest is the prebuilt PC port (no game code).
link = -static -mwindows -O2 kit:lib/port/main.obj kit:lib/port/settings.obj kit:lib/port/settings_menu.obj kit:lib/port/png_write.obj {objs} kit:lib/libssne-runtime.a kit:lib/libimgui.a kit:lib/libSDL2main.a -lwinmm -lpthread kit:lib/libgc.a kit:lib/libSDL2.a -lm -lkernel32 -luser32 -lgdi32 -lwinmm -limm32 -lole32 -loleaut32 -lversion -luuid -ladvapi32 -lsetupapi -ldinput8 -lopengl32 -lshell32
